1.437 1.4424M5.8385 12.012c.0067 3.4032 2.7706 6.1557 6.173 6.1493 3.4026-.0065 6.157-2.7701 6.1506-6.1733-.0065-3.4032-2.771-6.1565-6.174-6.1498-3.403.0067-6.156 2.771-6.1496 6.1738M8 12.0077a4 4 0 1 1 4.008 3.9921A3.9996 3.9996 0 0 1 8 12.0077"/></svg></a></nav>© 2026 <a href="https://mechanomorph.substack.com" rel="noopener">Asim Bakhshi · Mechanomorph</a>. <span data-i18n="foot.license">Reports may be quoted and shared unchanged, with attribution, under <a data-slot="cc" href="https://creativecommons.org/licenses/by-nc-nd/4.0/" rel="noopener license">CC BY-NC-ND 4.0</a>. Code and design: all rights reserved.</span> <a href="https://github.com/aasem/translation-criticism/blob/main/LICENSE" rel="noopener" data-i18n="foot.licence_link">Licence</a></div></footer>

<script type="module">
import { t as tt, tr, label, UR } from './assets/i18n.js';
import { analyse, cmpFigures, fillCmp, memberLabel, normalize, normalizeComparison, loadJSON, esc, md, urduWrap, icon, worst, sevClass,
  gradeClass, decisionClass, gradeName, isPublished, gridSVG, gridLegend, REPO, BRANCH, METHOD } from './assets/common.js';

const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id');
const H2 = (ic, t) => `<h2>${icon(ic)}${t}</h2>`;
let C, RS, A, F;

const fill = (x) => fillCmp(x, F);
const ur = (x) => `<span class="ur-s" lang="ur" dir="rtl">${esc(x)}</span>`;
const outcome = (m, r) => isPublished(r)
  ? `<span class="dec ${gradeClass(r.grade)}">${icon('scale')}${esc(tt('card.grade', { grade: gradeName(r.grade) }))}</span>`
  : `<span class="dec ${decisionClass(r.decision)}">${icon('gavel')}${esc(label('decision', r.decision))}</span>`;
const href = (r) => `report.html?id=${encodeURIComponent(r.id)}`;

function devHtml(s) {
  if (s.mergedInto) return `<p class="muted">${esc(tt('sbs.merged', { n: s.mergedInto }))}</p>`;
  const ds = (s.deviations || []).map((d) => {
    let x = `<p dir="auto"><span class="dev-tag">${esc(d.code)} · ${esc(label('sev', d.severity))}.</span> ${md(d.note).replace(/^<p>|<\/p>$/g, '')}</p>`;
    if ((d.functions || []).length) x += `<div class="fn-head">${tt('fn.head')}</div><ul class="fn-test">${d.functions.map((f) => `<li class="${f.kept ? '' : 'lost'}" dir="auto">${urduWrap(esc(f.fn))}</li>`).join('')}</ul>`;
    if (d.gain?.trim()) x += `<p class="gain" dir="auto"><b>${tt('gain.head')}</b> ${md(d.gain).replace(/^<p>|<\/p>$/g, '')}</p>`;
    if (d.compensatedBy) x += `<p class="gain"><b>${tt('comp.head', { n: d.compensatedBy })}</b></p>`;
    return x;
  }).join('');
  return ds || `<p>${tt('sbs.none')}</p>`;
}
const textCell = (s) => (s.mergedInto && !s.submission?.trim() ? `<span class="muted">${esc(tt('sbs.merged', { n: s.mergedInto }))}</span>` : ur(s.submission));
const lowestText = (seg) => (seg.tie ? `<span class="muted">${tt('cmp.tie')}</span>` : `<strong>${seg.lowest.map((k) => esc(A.members[k].label)).join(' · ')}</strong>`);

function header() {
  const langs = `${esc(RS[0].source?.language)} → ${esc(RS[0].submission?.language)}`;
  return `<h1 dir="auto">${esc(C.title)}</h1>
    <p class="subtitle" dir="auto">${esc(C.subtitle)}</p>
    <p class="byline"><span>${icon('calendar')}${esc(C.date)}</span></p>
    <div class="meta-chips">
      <span class="chip kind">${icon('columns')}${esc(tt('cmp.kind'))}</span>
      <span class="chip">${icon('layers')}${esc(tt('cmp.chip', { n: RS.length }))}</span>
      <span class="chip">${icon('layers')}${esc(tt('report.typeChip', { type: label('textType', RS[0].textType) }))}</span>
      <span class="chip">${icon('globe')}${langs}</span>
      ${(C.tags || []).map((x) => `<a class="chip tag" href="./?q=${encodeURIComponent(x)}">${esc(x)}</a>`).join('')}
    </div>`;
}

function passages() {
  let h = H2('doc', tt('h.passages'));
  h += `<h3>${tt('h.source')} (${esc(RS[0].source?.language || '')})${RS[0].source?.label ? ' - ' + esc(RS[0].source.label) : ''}</h3><div class="passage" dir="auto"><p>${urduWrap(esc(RS[0].source.text))}</p></div>`;
  RS.forEach((r, k) => {
    h += `<details class="cmp-passage"><summary><h3>${esc(A.members[k].label)}</h3></summary><div class="passage ur-block" lang="ur" dir="rtl">${esc(r.submission.text)}</div></details>`;
  });
  return h;
}

function summary() {
  const top = Math.max(...A.members.map((m) => m.score));
  const rows = A.members.map((m, k) => {
    const r = RS[k];
    const sub = isPublished(r) ? [r.publication?.publisher, r.publication?.year].filter(Boolean).join(', ') : label('stage', r.stage);
    const pref = r.id === C.preferred;
    return `<tr class="${pref ? 'cmp-pref' : ''}">
      <td><a href="${href(r)}"><strong dir="auto">${urduWrap(esc(m.label))}</strong></a>${pref ? ` <span class="badge">${icon('check')}</span>` : ''}<div class="hint" dir="auto">${urduWrap(esc(sub))}</div></td>
      <td>${outcome(m, r)}</td>
      <td class="num"><span class="${gradeClass(m.band)}"><b>${m.score.toFixed(1)}</b> · ${m.band}</span></td>
      <td class="num">${m.A} · ${m.B} · ${m.C}</td>
      <td class="num">${r.segments ? `${(tallyOf(r).Critical)} · ${tallyOf(r).Major}` : ''}</td>
      <td class="num">${m.wins}</td>
      <td class="num">${m.proximity == null ? '–' : Math.round(m.proximity)}</td>
      <td class="num">${m.mimicry == null ? '–' : Math.round(m.mimicry)}</td>
    </tr>`;
  }).join('');
  // Grid labels: number and surname, so members stay distinct even when names are missing.
  const pts = A.members.map((m, k) => ({ m, k })).filter(({ m }) => m.mimicry != null).map(({ m, k }) => ({
    x: m.mimicry, y: m.score, href: href(RS[k]),
    label: [`${k + 1}. ${RS[k].submission?.translator ? RS[k].submission.translator.split(' ').pop() : tt('grid.unnamed')}`] }));
  return `${H2('chart', tt('cmp.h.summary'))}
    <table class="cmp-sum"><thead><tr><th>${tt('cmp.th.translation')}</th><th>${tt('cmp.th.outcome')}</th><th class="num">${tt('cmp.th.score')}</th><th class="num">A · B · C</th><th class="num">${tt('cmp.th.severe')}</th><th class="num">${tt('cmp.th.lowest')}</th><th class="num">${tt('h.prox')}</th><th class="num">${tt('art.axisX')}</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">${tt('cmp.summary.hint')}</p>
    ${pts.length ? `<div class="prox-grid cmp-grid">${gridSVG(pts)}<p class="prox-hint">${tt('cmp.grid.hint')}</p>${gridLegend()}</div>` : ''}`;
}
const tallyOf = (r) => { const x = { Critical: 0, Major: 0 }; for (const s of r.segments || []) for (const d of s.deviations || []) if (d.severity in x) x[d.severity]++; return x; };

function sideBySide() {
  const N = RS.length;
  let body = '';
  if (N === 2) {
    body = `<table class="sbs cmp-sbs two"><colgroup><col class="c-n"><col style="width:17%"><col style="width:17%"><col><col style="width:17%"><col><col style="width:8em"></colgroup><thead><tr><th>#</th><th>${tt('h.source')}</th>${A.members.map((m) => `<th dir="auto">${urduWrap(esc(m.label))}</th><th>${tt('th.deviations')}</th>`).join('')}<th>${tt('cmp.th.lowest')}</th></tr></thead><tbody>${
      A.segments.map((seg, i) => `<tr><td class="num">${seg.n}</td><td dir="auto">${urduWrap(esc(RS[0].segments[i].source))}</td>${
        RS.map((r, k) => { const s = r.segments[i]; return `<td class="sub" lang="ur" dir="rtl">${textCell(s)}</td><td class="devs ${sevClass(worst(s.deviations))}">${devHtml(s)}<p class="pen">${tt('cmp.th.penalty')}: <b>${seg.penalties[k]}</b></p></td>`; }).join('')
      }<td class="lowest">${lowestText(seg)}</td></tr>`).join('')}</tbody></table>`;
  } else {
    body = `<table class="sbs cmp-sbs stack"><colgroup><col class="c-n"><col style="width:42%"><col><col style="width:6.5em"></colgroup><thead><tr><th>#</th><th>${tt('h.source')} / ${tt('cmp.th.translation')}</th><th>${tt('th.deviations')}</th><th class="num">${tt('cmp.th.penalty')}</th></tr></thead>${
      A.segments.map((seg, i) => `<tbody class="seg"><tr class="src"><td class="num" rowspan="${N + 1}">${seg.n}</td><td dir="auto">${urduWrap(esc(RS[0].segments[i].source))}</td><td class="lowest" colspan="2">${tt('cmp.th.lowest')}: ${lowestText(seg)}</td></tr>${
        RS.map((r, k) => { const s = r.segments[i]; const lo = !seg.tie && seg.lowest.includes(k);
          return `<tr><td class="sub"><div class="who" dir="auto">${urduWrap(esc(A.members[k].label))}</div><div lang="ur" dir="rtl">${textCell(s)}</div></td><td class="devs ${sevClass(worst(s.deviations))}">${devHtml(s)}</td><td class="num pen ${lo ? 'lo' : ''}">${lo ? icon('check') : ''}<b>${seg.penalties[k]}</b></td></tr>`; }).join('')
      }</tbody>`).join('')}</table>`;
  }
  return `${H2('columns', tt('h.sbs'))}${body}<p class="hint">${tt('cmp.sbs.hint')}</p>`;
}

function hard() {
  const hs = A.segments.filter((s) => s.hard);
  const list = hs.map((s) => `#${s.n}${s.shared.length ? ` (${esc(tt('cmp.hard.shared', { codes: s.shared.join(', ') }))})` : ''}`).join(', ');
  return `${H2('target', tt('cmp.h.hard'))}<p>${hs.length ? tt('cmp.hard.p', { list }) : tt('cmp.hard.none')}</p>`;
}

function preferred() {
  const top = A.members.reduce((a, m) => (m.score > a.score ? m : a));
  const k = RS.findIndex((r) => r.id === C.preferred); const p = A.members[k];
  return `${H2('scale', tt('cmp.h.preferred'))}
    <p class="decision-line">${icon('check')}<strong dir="auto">${p ? urduWrap(esc(tt('cmp.preferred.line', { label: p.label }))) : '–'}</strong></p>
    <p class="hint">${esc(tt('cmp.preferred.hint', { label: top.label, score: top.score.toFixed(1), band: top.band }))}${p && p.score < top.score ? ' ' + tt('cmp.moved') : ''}</p>
    ${note(tt('dec.basis'), C.preferredBasis)}${note(tt('cmp.note'), C.note)}
    <p class="ack">${tt('cmp.ack')}</p>`;
}
const note = (lab, text) => UR
  ? `<p><strong>${lab}</strong></p><div dir="auto">${md(fill(text))}</div>`
  : `<p><strong>${lab}</strong> ${md(fill(text)).replace(/^<p>|<\/p>$/g, '')}</p>`;

function reportsList() {
  return `${H2('book', tt('cmp.h.reports'))}<ul class="cmp-reports">${RS.map((r, k) => `<li><a href="${href(r)}" dir="auto">${urduWrap(esc(A.members[k].label))}</a>: <span dir="auto">${esc(r.title)}</span></li>`).join('')}</ul>`;
}

function render() {
  document.title = tt('report.title', { title: C.title });
  $('root').innerHTML = [
    header(), passages(),
    C.lead?.trim() ? `<div class="lead">${icon('target', 'lead-ico')}<div dir="auto">${md(fill(C.lead))}</div></div>` : '',
    C.textNotes?.trim() ? `<table class="kv details"><tbody><tr><th>${tt('det.notes')}</th><td dir="auto">${md(fill(C.textNotes))}</td></tr></tbody></table>` : '',
    summary(), sideBySide(), hard(),
    C.tendencies?.trim() ? `${H2('wave', tt('cmp.h.tendencies'))}<div dir="auto">${md(fill(C.tendencies))}</div>` : '',
    preferred(), reportsList(),
  ].join('');
}

const sq = (s) => String(s || '').replace(/\s+/g, '');
try {
  if (!id) throw new Error('No comparison id in the address.');
  C = normalizeComparison(await loadJSON(`comparisons/${id}.json`));
  RS = (await Promise.all(C.members.map((m) => loadJSON(`reports/${m.id}.json`)))).map(normalize);
  const bad = RS.find((r) => r.segments.length !== RS[0].segments.length || r.segments.some((s, i) => sq(s.source) !== sq(RS[0].segments[i].source)));
  if (bad) throw Object.assign(new Error(bad.id), { mismatch: true });
  A = analyse(C, RS); F = cmpFigures(C, RS);
  $('b-gh').href = `https://github.com/${REPO}/blob/${BRANCH}/comparisons/${id}.json`;
  render();
} catch (e) {
  $('root').innerHTML = `<p class="empty">${esc(tt(e.mismatch ? 'cmp.mismatch' : 'cmp.loadError', { error: e.message }))} <a href="./">${tt('report.back')}</a></p>`;
}
$('b-print').onclick = () => print();
for (const [b, ic] of [['b-gh', 'code'], ['b-print', 'print']]) $(b).insertAdjacentHTML('afterbegin', icon(ic));
</script>
</body>
</html>
