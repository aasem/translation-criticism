[project]
name = "tc-core"
version = "2.0.0"
description = "Method, schema, scoring and validation for editorial assessments of translations"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tc_core"]

[tool.setuptools.package-data]
tc_core = ["method.json", "schema/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
